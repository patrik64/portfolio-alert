name: daily fetch

on:
  schedule:
    # cron runs in UTC while 4am Central European time moves with DST, so
    # both candidate hours fire and the guard keeps whichever is 4am local
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch-all:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - id: guard
        name: only at 4am CET/CEST
        run: |
          hour=$(TZ=Europe/Berlin date +%-H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$hour" = "4" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "not 4am in Central Europe (hour is $hour) — skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - if: steps.guard.outputs.run == 'true'
        name: refresh every fund
        run: node scripts/fetch-all.mjs
