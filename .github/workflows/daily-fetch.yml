name: daily fetch

on:
  schedule:
    # cron runs in UTC while 4am Central European time moves with DST, so
    # both candidate hours fire and the guard keeps whichever is 4am local;
    # :07 dodges the top-of-the-hour rush, when GitHub delays or drops runs
    - cron: '7 2 * * *'
    - cron: '7 3 * * *'
  workflow_dispatch:
    inputs:
      announce_only:
        description: 'skip the refresh, just announce the current newcomers'
        type: boolean
        default: false

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch-all:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - id: guard
        name: only at 4am CET/CEST
        run: |
          hour=$(TZ=Europe/Berlin date +%-H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$hour" = "4" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "not 4am in Central Europe (hour is $hour) — skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - if: steps.guard.outputs.run == 'true' && github.event.inputs.announce_only != 'true'
        name: refresh every fund
        run: node scripts/fetch-all.mjs

      # a night where too many scrapers broke still found companies worth
      # announcing, so this runs even when the refresh above reports failure
      - if: ${{ !cancelled() && steps.guard.outputs.run == 'true' }}
        name: announce the newcomers on bluesky
        env:
          BLUESKY_IDENTIFIER: portfolio-alert.bsky.social
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          # by hand, the announcement covers the whole newcomers page rather
          # than one run's findings
          MODE: ${{ github.event.inputs.announce_only == 'true' && '--current' || '' }}
        run: node scripts/post-newcomers.mjs $MODE
