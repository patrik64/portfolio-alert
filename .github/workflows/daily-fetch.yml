name: daily fetch

on:
  schedule:
    # a fixed utc time (23:23/0:23 in Vienna depending on dst); :23 dodges the
    # top-of-the-hour rush, when GitHub delays or drops scheduled runs
    - cron: '23 22 * * *'
  workflow_dispatch:
    inputs:
      announce_only:
        description: 'skip the refresh, just announce the current newcomers'
        type: boolean
        default: false
      force:
        description: 'refresh even if a full refresh already ran in the last 12 hours'
        type: boolean
        default: false
      funds:
        description: 'with announce_only: limit the announcement to these fund slugs, comma-separated'
        type: string
        default: ''
      delete_post:
        description: 'take back this bluesky post (url or rkey) instead of fetching or announcing'
        type: string
        default: ''

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch-all:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # the script stands down on its own when a full refresh already ran in
      # the last 12 hours — a hand-started run and a late nightly landing the
      # same morning would clear the day's newcomers — and 'force' overrides
      - if: github.event.inputs.announce_only != 'true' && github.event.inputs.delete_post == ''
        name: refresh every fund
        run: node scripts/fetch-all.mjs ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      # a night where too many scrapers broke still found companies worth
      # announcing, so this runs even when the refresh above reports failure
      - if: ${{ !cancelled() && github.event.inputs.delete_post == '' }}
        name: announce the newcomers on bluesky
        env:
          BLUESKY_IDENTIFIER: portfolio-alert.bsky.social
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          # by hand, the announcement covers the whole newcomers page rather
          # than one run's findings — or the named funds' share of it
          MODE: ${{ github.event.inputs.announce_only == 'true' && '--current' || '' }}
          FUNDS: ${{ github.event.inputs.announce_only == 'true' && github.event.inputs.funds || '' }}
        run: node scripts/post-newcomers.mjs $MODE ${FUNDS:+--funds=$FUNDS}

      # an announcement that turned out wrong — a page rendering its whole
      # portfolio at once, say, counted as newcomers — is taken back here, the
      # app password never leaving the runner
      - if: github.event.inputs.delete_post != ''
        name: take back a bluesky post
        env:
          BLUESKY_IDENTIFIER: portfolio-alert.bsky.social
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: node scripts/delete-bluesky-post.mjs "${{ github.event.inputs.delete_post }}"
