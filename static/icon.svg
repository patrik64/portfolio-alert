<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
	<!-- the app icon: the favicon's three rising bars on the hero's teal, the newest in amber. icon-512.png and apple-touch-icon.png (180px) are this, drawn by a browser -->
	<defs>
		<radialGradient id="bg" cx="88%" cy="0%" r="130%">
			<stop offset="0" stop-color="#00897b"/>
			<stop offset=".42" stop-color="#00695c"/>
			<stop offset="1" stop-color="#00423d"/>
		</radialGradient>
	</defs>
	<rect width="512" height="512" fill="url(#bg)"/>
	<g transform="translate(106 106) scale(15)">
		<rect x="2" y="10" width="4" height="8" rx="1" fill="#fff" fill-opacity=".72"/>
		<rect x="8" y="6" width="4" height="12" rx="1" fill="#fff"/>
		<rect x="14" y="2" width="4" height="16" rx="1" fill="#e6b12e"/>
	</g>
</svg>
